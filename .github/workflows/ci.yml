
# CI for TP01: test Java code and validate quality before Docker publishing.
name: CI DevOps

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test-backend:
    name: Build and test Spring Boot
    runs-on: ubuntu-24.04

    steps:
      # Fetch the complete history required by SonarQube analysis.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install Java 21 and reuse Maven dependencies between CI runs.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/simple-api/pom.xml

      # Run unit and PostgreSQL Testcontainers integration tests.
      - name: Build and test backend
        working-directory: backend/simple-api
        run: mvn -B clean verify

      # Run SonarQube only for a push on main.
      # Waiting for the Quality Gate prevents CD from publishing
      # when code quality checks do not pass.
      - name: SonarQube Cloud analysis and Quality Gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: backend/simple-api
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=cz632804-cpu_devops-tp1 \
            -Dsonar.organization=cz632804-cpu \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true
