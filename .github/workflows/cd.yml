
# Continuous Delivery: publish TP01 Docker images after a successful CI.
name: CD DevOps

on:
  workflow_run:
    workflows:
      - CI DevOps
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push-docker-image:
    name: Build and publish Docker images
    runs-on: ubuntu-24.04

    # Publish only after a successful CI triggered by a push on main.
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}

    steps:
      # Build exactly the revision that successfully passed CI.
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # Authenticate without exposing credentials in the YAML file.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Publish Spring Boot.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend/simple-api
          push: true
          tags: nifdgg/tp01-backend:latest

      # Publish PostgreSQL image and initialization scripts.
      - name: Build and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: true
          tags: nifdgg/tp01-database:latest

      # Publish the Apache HTTP server and reverse proxy.
      - name: Build and push HTTP server
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: true
          tags: nifdgg/tp01-http-server:latest
