# Apache reverse proxy for the Spring Boot backend.
<VirtualHost *:80>

    ServerName localhost

    # Do not allow Apache to become an open forward proxy.
    ProxyRequests Off

    # Route all HTTP requests to the backend container.
    # "backend" is resolved by Docker Compose DNS.
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

</VirtualHost>