# Reverse proxy to the Spring Boot service.
<VirtualHost *:80>

    ServerName localhost

    # Disable forward proxy behavior.
    ProxyRequests Off

    # Preserve the incoming Host header.
    ProxyPreserveHost On

    # Serve the local Apache landing page directly.
    ProxyPass /index.html !

    # Forward all other requests to Spring Boot.
    ProxyPass / http://backend:8080/
    ProxyPassReverse / http://backend:8080/

    # Write logs to Docker output.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

</VirtualHost>