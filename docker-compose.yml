# TP01 - Three-tier Docker application
# Apache HTTP Server -> Spring Boot -> PostgreSQL

services:

  # PostgreSQL database
  database:
    build:
      context: ./database
    image: tp01-database
    restart: unless-stopped

    # Read database configuration from the .env file.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Keep PostgreSQL data after container recreation.
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # Check that PostgreSQL is ready to accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - tp01-network

  # Spring Boot REST API
  backend:
    build:
      context: ./backend/simple-api
    image: tp01-backend
    restart: unless-stopped

    # Use the same database credentials as PostgreSQL.
    # "database" is resolved by Docker's internal DNS.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    # Wait until PostgreSQL is healthy before starting the backend.
    depends_on:
      database:
        condition: service_healthy

    # Backend is accessible to other containers, not published to the host.
    expose:
      - "8080"

    networks:
      - tp01-network

  # Apache HTTP reverse proxy
  http-server:
    build:
        context: .
        dockerfile: http-server/Dockerfile
    image: tp01-http-server
    restart: unless-stopped

    # Host port 8081 -> Apache container port 80.
    ports:
      - "8081:80"

    depends_on:
      - backend

    networks:
      - tp01-network

# Internal network shared by all three services.
networks:
  tp01-network:
    driver: bridge

# Persistent PostgreSQL storage.
volumes:
  postgres-data: